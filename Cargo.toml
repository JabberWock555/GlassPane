[package]
name = "glasspane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, glassy Home Assistant wall dashboard for old tablets and phones (works on Chrome 57)"
license = "MIT"
readme = "README.md"
keywords = ["home-assistant", "dashboard", "kiosk", "smart-home", "tablet"]
categories = ["web-programming"]
default-run = "glasspane"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
